[package]
name = "praxis-assistent"
version = "0.1.0"
description = "Praxis-Assistent – Abrechnungsprüfung, Diktat, DURIA-Anbindung (lokal)"
edition = "2021"
publish = false

[lib]
name = "praxis_assistent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
# KI-Assistent (optional): HTTP zur Claude API und Schlüssel in der Windows-Anmeldeinformationsverwaltung
reqwest = { version = "0.13", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
# Schlüssel-Transferdatei (Argon2id + AES-256-GCM), Geheimnisse im Speicher nach Gebrauch überschreiben
aes-gcm = "0.10"
zeroize = "1"

# Argon2 auch in Test-/Debug-Builds optimiert (sonst dauert eine Schlüsselableitung mit 64 MiB Sekunden).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
# Klein und sparsam: wichtig auf dem Terminalserver (eine Instanz je RDP-Sitzung).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
