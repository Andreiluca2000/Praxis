[package]
name = "praxis-assistent"
version = "0.1.0"
description = "Praxis-Assistent – Abrechnungsprüfung, Diktat, DURIA-Anbindung (lokal)"
edition = "2021"
publish = false

[lib]
name = "praxis_assistent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }

[profile.release]
# Klein und sparsam: wichtig auf dem Terminalserver (eine Instanz je RDP-Sitzung).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
