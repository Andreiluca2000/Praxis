# Baut den Windows-Installer (NSIS) des Praxis-Assistenten auf GitHub.
# Start: Reiter „Actions“ → „Installer“ → „Run workflow“, oder ein Tag v* pushen (dann zusätzlich als Release).
# Ergebnis: unter dem Lauf als Artefakt „Praxis-Assistent-Installer“ (bzw. im Release) zum Herunterladen.
name: Installer

on:
  workflow_dispatch:
  push:
    # Tags v* bauen immer; auf main nur, wenn sich dieser Workflow ändert (Windows-Minuten sparen).
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/installer.yml']

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      # Der ICD-Katalog ist eine abgeleitete Datei (nicht im Repository) und wird vom Fenster geladen.
      - name: ICD-Katalog erzeugen
        run: pnpm import:icd

      - name: Typprüfung und Tests
        run: pnpm typecheck && pnpm test

      - name: Installer bauen
        run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: Praxis-Assistent-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" src-tauri/target/release/bundle/nsis/*.exe --title "Praxis-Assistent ${{ github.ref_name }}" --notes "Windows-Installer, gebaut aus ${{ github.sha }}."
